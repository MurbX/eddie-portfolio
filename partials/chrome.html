  <!-- Page-transition curtain -->
  <div class="curtain" aria-hidden="true">
    <div class="panels"><i></i><i></i><i></i><i></i><i></i></div>

      <!-- decoding="sync": the logo is painted in the very first frame, never popping in after -->
      <img class="curtain__mark" src="/brand/mark.webp" alt="" width="256" height="426" decoding="sync" fetchpriority="high" />
      <!-- The page name is in the HTML itself, so the arriving page shows the complete curtain immediately -->
      <p class="curtain__label" data-curtain-label><span>{{page}}</span></p>
      <span class="curtain__line"></span>
      <!-- Short lines that slide along the four seams between the panels and stop -->
      <div class="curtain__seams"><i><b></b></i><i><b></b></i><i><b></b></i><i><b></b></i></div>
    </div>
  </div>
