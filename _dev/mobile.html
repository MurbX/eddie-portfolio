<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Mobile preview (dev only)</title>
  <style>
    body { margin: 0; background: #222; display: flex; gap: 24px; padding: 24px; align-items: flex-start; font: 12px system-ui; color: #aaa; }
    figure { margin: 0; display: grid; gap: 6px; }
    iframe { border: 0; background: #000; border-radius: 18px; }
  </style>
</head>
<body>
  <figure><iframe src="/" width="390" height="844"></iframe><figcaption>390 × 844 (iPhone 14)</figcaption></figure>
  <figure><iframe src="/" width="360" height="760"></iframe><figcaption>360 × 760 (Android)</figcaption></figure>
  <figure><iframe src="/" width="820" height="1100"></iframe><figcaption>820 × 1100 (iPad)</figcaption></figure>
</body>
</html>
